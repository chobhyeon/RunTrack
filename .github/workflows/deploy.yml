name: Deploy

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'
      - 'docker-compose.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 배포는 test 통과 후에만 실행되도록 설정 가능
    # needs: [test]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Check Docker Hub credentials
      id: docker_credentials
      env:
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      run: |
        if [ -n "$DOCKER_USERNAME" ] && [ -n "$DOCKER_PASSWORD" ]; then
          echo "configured=true" >> "$GITHUB_OUTPUT"
        else
          echo "configured=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Login to Docker Hub
      if: steps.docker_credentials.outputs.configured == 'true'
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
      # ⚠️ Secrets 설정 필요:
      # GitHub Settings → Secrets and variables → Actions
      # DOCKER_USERNAME: Docker Hub 사용자명
      # DOCKER_PASSWORD: Docker Hub 토큰
    
    - name: Build and push Docker image
      if: steps.docker_credentials.outputs.configured == 'true'
      uses: docker/build-push-action@v4
      with:
        context: ./backend
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/runtrack-backend:latest
          ${{ secrets.DOCKER_USERNAME }}/runtrack-backend:${{ github.sha }}
    
    - name: Verify image pushed
      if: steps.docker_credentials.outputs.configured == 'true'
      run: |
        echo "✅ Docker image pushed successfully!"
        echo "Image: ${{ secrets.DOCKER_USERNAME }}/runtrack-backend:latest"
        echo "SHA tag: ${{ github.sha }}"
    
    - name: Skip deployment without Docker Hub credentials
      if: steps.docker_credentials.outputs.configured != 'true'
      run: |
        echo "⚠️ Deployment skipped: configure DOCKER_USERNAME and DOCKER_PASSWORD repository secrets to publish the image."

    # 이 부분은 실제 서버 환경에 따라 커스터마이징 필요
    - name: Deploy to Production (Example - Replace with actual deployment)
      if: steps.docker_credentials.outputs.configured == 'true'
      run: |
        echo "🚀 Deployment trigger sent to production server"
        echo "Next step: SSH to server and run:"
        echo "  docker pull ${{ secrets.DOCKER_USERNAME }}/runtrack-backend:latest"
        echo "  docker-compose -f docker-compose.yml up -d"
      # 실제 배포는 다음 옵션 중 선택:
      # 1. SSH로 직접 서버 접속
      # 2. AWS CodeDeploy
      # 3. Google Cloud Run
      # 4. Azure Container Instances
      # 5. Kubernetes (EKS, GKE, AKS)
    
    - name: Send notification
      if: always()
      uses: actions/github-script@v6
      with:
        script: |
          const status = '${{ job.status }}'
          const credentialsConfigured = '${{ steps.docker_credentials.outputs.configured }}' === 'true'
          const message = status !== 'success'
            ? '❌ Deployment failed!'
            : credentialsConfigured
              ? '✅ Deployment succeeded!'
              : '⚠️ Deployment skipped: Docker Hub credentials are not configured.'
          console.log(message)
