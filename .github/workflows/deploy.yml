name: Deploy

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'
      - 'docker-compose.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 배포는 test 통과 후에만 실행되도록 설정 가능
    # needs: [test]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
      # ⚠️ Secrets 설정 필요:
      # GitHub Settings → Secrets and variables → Actions
      # DOCKER_USERNAME: Docker Hub 사용자명
      # DOCKER_PASSWORD: Docker Hub 토큰
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: ./backend
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/runtrack-backend:latest
          ${{ secrets.DOCKER_USERNAME }}/runtrack-backend:${{ github.sha }}
    
    - name: Verify image pushed
      run: |
        echo "✅ Docker image pushed successfully!"
        echo "Image: ${{ secrets.DOCKER_USERNAME }}/runtrack-backend:latest"
        echo "SHA tag: ${{ github.sha }}"
    
    # 이 부분은 실제 서버 환경에 따라 커스터마이징 필요
    - name: Deploy to Production (Example - Replace with actual deployment)
      run: |
        echo "🚀 Deployment trigger sent to production server"
        echo "Next step: SSH to server and run:"
        echo "  docker pull ${{ secrets.DOCKER_USERNAME }}/runtrack-backend:latest"
        echo "  docker-compose -f docker-compose.yml up -d"
      # 실제 배포는 다음 옵션 중 선택:
      # 1. SSH로 직접 서버 접속
      # 2. AWS CodeDeploy
      # 3. Google Cloud Run
      # 4. Azure Container Instances
      # 5. Kubernetes (EKS, GKE, AKS)
    
    - name: Send notification
      if: always()
      uses: actions/github-script@v6
      with:
        script: |
          const status = '${{ job.status }}'
          const message = status === 'success' 
            ? '✅ Deployment succeeded!'
            : '❌ Deployment failed!'
          console.log(message)
